name: build-dataset
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - run: python scripts/build_dataset.py
      - uses: actions/upload-artifact@v4
        with:
          name: eurosat-manifest
          path: data/processed/
