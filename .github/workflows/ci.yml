name: ci
# Not run on every push, to conserve free Actions minutes. Trigger manually
# (Actions tab -> ci -> Run workflow) or via pull request.
on:
  pull_request:
    paths: ["src/**", "tests/**", "pyproject.toml"]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # CPU torch first: the default wheel pulls ~2 GB of CUDA libraries. Without torch,
      # scikit-learn and scipy, importorskip silently skips most of the suite.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[serve,dev]"
      - run: pytest -q
