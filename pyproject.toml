[project]
name = "terraforge"
version = "0.1.0"
description = "Earth Observation AI pipeline"
requires-python = ">=3.10"
dependencies = ["numpy", "xarray", "rasterio", "geopandas", "pystac-client"]

[project.optional-dependencies]
train = ["torch", "mlflow"]
serve = ["torch", "fastapi", "uvicorn", "huggingface_hub", "httpx"]
dev = ["pytest", "httpx", "scikit-learn", "scipy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
